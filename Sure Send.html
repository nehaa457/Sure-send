<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sure Send</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#0b1b3a;--mu:#64708a;--bd:#e3e8f1;--nv:#0b1b3a;--bl:#2563eb;--gr:#16a34a;--rd:#dc2626;--or:#d97706;--sf:#eef3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#111c38;--tx:#e8eeff;--mu:#93a0bf;--bd:#22305a;--nv:#060c1b;--sf:#16244a}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#111c38;--tx:#e8eeff;--mu:#93a0bf;--bd:#22305a;--nv:#060c1b;--sf:#16244a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;font-weight:600;transition:.2s}
.p{background:var(--bl);color:#fff}.p:hover{filter:brightness(1.1);transform:translateY(-1px)}.s{background:var(--sf);color:var(--bl)}.g{background:none;color:var(--mu);border:1px solid var(--bd)}
.sm{padding:5px 10px;font-size:12px}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}.logo i{background:var(--bl);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-style:normal}
.app{display:flex;min-height:100vh}aside{width:220px;background:var(--nv);color:#cbd6f5;padding:18px 12px;flex:none}
aside .logo{color:#fff;margin:0 8px 18px}aside a{display:block;padding:9px 12px;border-radius:9px;cursor:pointer;color:#a9b8e0;margin-bottom:2px}aside a:hover{background:#ffffff14}aside a.on{background:var(--bl);color:#fff}
main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);gap:10px;flex-wrap:wrap}
.pg{padding:24px;max-width:1100px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 2px 8px #0b1b3a0d;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.big{font-size:28px;font-weight:800}.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;background:var(--bl);border-radius:9px;transition:width .4s}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}.tw{overflow-x:auto}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:#16a34a22;color:var(--gr)}.er{background:#dc262622;color:var(--rd)}.wn{background:#d9770622;color:var(--or)}.in{background:#2563eb22;color:var(--bl)}
.hero{background:var(--nv);color:#fff;text-align:center;padding:60px 20px 50px}.hero h1{font-size:44px}.hero p{max-width:560px;margin:10px auto 24px;color:#b7c4e8}
.flow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin:26px 0}.flow span{background:#ffffff14;border:1px solid #ffffff26;padding:8px 14px;border-radius:10px;font-size:13px}.flow.l span{background:var(--sf);border-color:var(--bd);color:var(--tx)}
.drop{border:2px dashed var(--bl);border-radius:16px;padding:34px;text-align:center;background:var(--sf);cursor:pointer}.drop:hover{background:var(--card)}
.cert{background:#fffdf5;color:#2b2b2b;border:8px double #b8892b;text-align:center;padding:26px 14px;position:relative;aspect-ratio:1.414;max-width:560px;width:100%;margin:auto;display:flex;flex-direction:column;justify-content:space-between;font-family:Georgia,serif}
.cert h3{letter-spacing:3px;margin:0;color:#0b1b3a}.cert .nm{color:#1d4ed8;font-weight:700}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--nv);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:9;pointer-events:none}#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:8}#modal.on{display:grid}
.ba{display:grid;gap:12px;grid-template-columns:1fr 1fr}.ba .card{margin:0}
@media(max-width:800px){.app{flex-direction:column}aside{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px}aside .logo{display:none}aside a{white-space:nowrap}.hero h1{font-size:32px}.ba{grid-template-columns:1fr}}

body{background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:22px 22px}
.p{background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 6px 18px #2563eb44}.p:hover{box-shadow:0 10px 26px #2563eb66}button:active{transform:scale(.95)!important}
.logo i{background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 0 14px #2563eb88}
aside{background:linear-gradient(180deg,var(--nv),#12245a)}aside a{transition:.2s}aside a:hover{transform:translateX(4px)}aside a.on{background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 4px 16px #2563eb66}
.card{transition:.25s}.grid .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #2563eb26;border-color:var(--bl)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#060c1b,#12245a 60%,#3b1d7a)}
.hero:before,.hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;filter:blur(90px);opacity:.45;animation:bl 9s ease-in-out infinite alternate}
.hero:before{background:#2563eb;left:-90px;top:-90px}.hero:after{background:#ec4899;right:-90px;bottom:-120px;animation-delay:-4s}
@keyframes bl{to{transform:translate(70px,50px) scale(1.2)}}.hero>*{position:relative;z-index:1}
.hero h1{background:linear-gradient(90deg,#fff,#93c5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.float{width:min(340px,86%);margin:8px auto 0;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 20px 30px #0008);transform:rotate(-3deg)}.float .cert{padding:12px 8px;font-size:11px}
@keyframes fl{50%{transform:translateY(-12px) rotate(2deg)}}
.flow span{transition:.2s}.flow span:hover{transform:translateY(-3px) scale(1.05)}
.flow.l span{animation:pu 2.5s infinite}.flow.l span:nth-child(2){animation-delay:.5s}.flow.l span:nth-child(3){animation-delay:1s}.flow.l span:nth-child(4){animation-delay:1.5s}.flow.l span:nth-child(5){animation-delay:2s}
@keyframes pu{50%{box-shadow:0 0 0 4px #2563eb44;border-color:var(--bl)}}
.bar{height:12px}.bar b{background:repeating-linear-gradient(45deg,#2563eb 0 10px,#3b82f6 10px 20px);background-size:28px 28px;animation:mv 1s linear infinite}@keyframes mv{to{background-position:28px 0}}
#log div{animation:in .3s;padding:3px 0}
.stp{display:flex;gap:4px;margin-bottom:22px;overflow-x:auto}.stp div{flex:1;min-width:64px;text-align:center;color:var(--mu);font-size:12px}
.stp b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--bd);transition:.3s}
.stp .dn b{background:var(--gr);color:#fff}.stp .cu b{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;animation:pu 1.6s infinite;transform:scale(1.15)}.stp .cu{color:var(--tx);font-weight:700}
.tag{transition:.2s}tr{transition:background .2s}tbody tr:hover,tr:hover td{background:var(--sf)}

button{position:relative;overflow:hidden}.rip{position:absolute;border-radius:50%;background:#fff7;width:14px;height:14px;margin:-7px;pointer-events:none;animation:rp .6s ease-out forwards}@keyframes rp{to{transform:scale(18);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.75) translateY(14px)}60%{transform:scale(1.05)}}
@keyframes zm{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
@keyframes bn{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.1)}}
@keyframes bp{50%{transform:scale(1.35);color:var(--bl)}}
.grid .card{animation:pop .55s backwards}.grid .card:nth-child(2){animation-delay:.06s}.grid .card:nth-child(3){animation-delay:.12s}.grid .card:nth-child(4){animation-delay:.18s}.grid .card:nth-child(5){animation-delay:.24s}.grid .card:nth-child(6){animation-delay:.3s}
.pg>.card{animation:pop .5s backwards}.tag{display:inline-block;animation:pop .4s backwards}
.bmp{display:inline-block;animation:bp .3s}
#modal{backdrop-filter:blur(5px);transition:.2s}#modal.on #mc{animation:zm .45s cubic-bezier(.34,1.56,.64,1)}
.pop{background:var(--card);border-radius:22px;padding:34px 28px;text-align:center;box-shadow:0 30px 70px #0007;border:1px solid var(--bd);max-width:380px;margin:auto}
.pop .pi{font-size:60px;animation:bn 1s .3s 2}.pop p{margin:6px 0 18px}
#toast{transform:translateY(40px) scale(.85);transition:.4s cubic-bezier(.34,1.56,.64,1)}#toast.on{transform:none}
.drop{animation:pu 2.5s infinite}.cert{transition:.3s}.cert:hover{transform:scale(1.02) rotate(-.5deg);box-shadow:0 18px 40px #0003}
</style></head><body><div id="root"></div><div id="toast"></div><div id="modal" onclick="if(event.target==this)this.classList.remove('on')"><div id="mc" style="width:600px;max-width:100%"></div></div>
<script>
const $=s=>document.querySelector(s);
const NAMES=[["Rahul Sharma","rahul@gmial.com"],["Priya Singh","priya@gmail"],["Arjun Kumar","arjun@gmail.com"],["Ananya Verma","ananya@gmail.com"],["Arjun Kumar","arjun@gmail.com"],["Meera Iyer","meera@outlook.com"],["Karan Patel","karan@yahoo.com"],["Sneha Reddy","sneha@gmail.com"],["Vikram Rao","vikram@@gmail.com"],["Diya Gupta","diya@gmail.com"],["Rohan Mehta","rohan@hotmail.com"],["Isha Nair","isha@gmail.com"]];
let S={v:'home',demo:true,up:false,an:false,fixed:false,gen:false,sent:false,tpl:0,font:'Georgia',size:28,pos:50,ev:'HackSprint 2026',sub:'Your Certificate of Participation 🎉',sender:'Sure Send Team',
body:"Hi {{Name}},\n\nCongratulations on successfully participating in {{Event}}!\n\nYour personalized certificate ({{Certificate}}) is attached to this email.\n\nThank you for being part of the event.\n\nBest regards,\nSure Send Team",
rows:NAMES.map((r,i)=>({n:r[0],e:r[1],st:i==1||i==8?'Invalid':i==4?'Duplicate':i==0?'Typo':'Valid',es:'Pending',t:'—'})),sel:0,cnt:{s:0,f:0}};
const NAV=[['dash','📊 Dashboard'],['upload','📤 Upload Sheet'],['tpl','🎓 Certificate Template'],['rec','✅ Recipients'],['gen','⚡ Generate'],['email','✉️ Email Delivery'],['status','📬 Delivery Status'],['ana','📈 Analytics'],['hood','🛠 Under the Hood'],['set','⚙️ Settings']];
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)};
const go=v=>{S.v=v;render();scrollTo(0,0);if(v=='done')confetti()};
const tag=s=>`<span class="tag ${{Valid:'ok',Sent:'ok',Generated:'ok',Invalid:'er',Failed:'er',Duplicate:'wn',Typo:'wn',Pending:'wn',Retrying:'in','Auto-corrected':'ok'}[s]||'in'}">${s}</span>`;
const pb=(p)=>`<div class="bar"><b style="width:${p}%"></b></div>`;
const cert=(n,sz)=>`<div class="cert"><div><small>${S.ev}</small><h3>CERTIFICATE OF PARTICIPATION</h3></div><div style="margin-top:${S.pos-50}px"><div>This certificate is proudly presented to</div><div class="nm" style="font:700 ${sz||S.size}px ${S.font};margin:8px 0">${n}</div><div>For successfully participating in the event.</div></div><div style="display:flex;justify-content:space-between;font-size:12px"><span>Sept 29, 2026</span><span>______<br>Organizer Signature</span></div></div>`;
const step=(t,to,dis)=>`<div style="margin-top:14px"><button class="p" ${dis?'disabled style="opacity:.4"':''} onclick="go('${to}')">${t} →</button></div>`;
const valid=()=>S.rows.filter(r=>r.st=='Valid'||r.st=='Auto-corrected').length;
function view(){const v=S.v,R=S.rows;
if(v=='dash')return`<h1>Dashboard</h1><p class="mu">Campaign: ${S.ev}</p><div class="grid">${[['Total Recipients',500],['Valid Emails',486],['Certificates Generated',S.gen?486:470],['Successfully Sent',S.sent?481:465],['Failed',S.sent?5:5],['Pending',S.sent?0:16]].map(c=>`<div class="card"><div class="mu">${c[0]}</div><div class="big">${c[1]}</div></div>`).join('')}</div>
<div class="card"><h2>Certificate Campaign Progress</h2><div class="bar"><b style="width:${(S.sent?481:465)/486*100}%"></b></div><p class="mu">${S.sent?481:465} / 486 sent</p></div>
<div class="ba"><div class="card" style="border-color:var(--rd)"><h2>Before</h2>✗ Manual name entry<br>✗ Manual PDF creation<br>✗ Manual email sending<br>✗ No delivery tracking</div><div class="card" style="border-color:var(--gr)"><h2>After</h2>✓ One spreadsheet<br>✓ Automated certificates<br>✓ Personalized emails<br>✓ Delivery tracking</div></div>
<button class="p" onclick="go('upload')">Run the demo campaign →</button>`;
if(v=='upload')return`<h1>Connect Your Participant Data</h1><p class="mu">Supported columns: Name, Email</p><div class="grid g2"><div class="card"><h2>Connect Google Sheet</h2><p class="mu">Demo Mode uses a simulated sheet.</p><button class="p" onclick="S.up=1;render();toast('Sheet connected (demo)')">Connect Google Sheets</button></div><div class="card drop" onclick="S.up=1;render();toast('participants.xlsx uploaded')" ondragover="event.preventDefault()" ondrop="event.preventDefault();S.up=1;render()"><h2>⬆ Drop your CSV/XLSX file here</h2><span class="mu">or click to browse</span></div></div>
${S.up?`<div class="card"><h2>participants.xlsx · 500 rows</h2><div class="tw"><table><tr><th>participant_full_name</th><th>email_id</th></tr>${R.slice(0,5).map(r=>`<tr><td>${r.n}</td><td>${r.e}</td></tr>`).join('')}</table></div><br>
${S.an=='run'?`<span class="spin">⟳</span> Analyzing spreadsheet…`:S.an?`<h2>Smart Column Detection</h2>✓ Name column detected<br>✓ Email column detected<br>✓ 500 rows analyzed<div class="grid g2" style="margin:12px 0"><div class="card" style="margin:0"><code>participant_full_name</code> → <b>Name</b></div><div class="card" style="margin:0"><code>email_id</code> → <b>Email Address</b></div></div><b style="color:var(--gr)">98% Mapping Confidence</b> ${pb(98)}<br><button class="g" onclick="toast('Mapping editor: pick columns from dropdowns (demo)')">Edit Mapping</button>${step('Continue to Validation','rec')}`:`<button class="p" onclick="analyze()">Analyze Sheet</button>`}</div>`:''}`;
if(v=='rec'){const bad=R.filter(r=>r.st!='Valid'&&r.st!='Auto-corrected').length;return`<h1>Data Quality Check</h1><div class="grid"><div class="card"><div class="big" style="color:var(--gr)">✓ ${S.fixed?486+4:486}</div>valid emails</div><div class="card"><div class="big" style="color:var(--or)">⚠ ${S.fixed?0:9}</div>duplicates</div><div class="card"><div class="big" style="color:var(--rd)">⚠ ${S.fixed?0:5}</div>invalid</div></div>
<div class="card"><p class="mu">Regex validation + fuzzy domain matching: <code>rahul@gmial.com</code> → <code>rahul@gmail.com</code> ${tag('Auto-corrected')}</p><button class="p" onclick="autofix()" ${bad?'':'disabled style="opacity:.5"'}>Auto-Fix Issues</button> <button class="g" onclick="toast('Manual review: edit cells inline (demo)')">Review Manually</button>
<div class="tw"><table><tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr>${R.map((r,i)=>`<tr><td>${r.n}</td><td>${r.e}</td><td>${tag(r.st)}</td><td>${r.st=='Valid'||r.st=='Auto-corrected'?'—':`<button class="s sm" onclick="fix(${i})">${r.st=='Duplicate'?'Review':'Fix'}</button>`}</td></tr>`).join('')}</table></div></div>${step('Continue to Template','tpl',bad)}`}
if(v=='tpl')return`<h1>Certificate Template</h1><div class="grid g2"><div class="card"><label>Preview as</label><select onchange="S.sel=this.value;render()">${R.map((r,i)=>`<option value="${i}" ${i==S.sel?'selected':''}>${r.n}</option>`).join('')}</select>
<label>Template</label><select onchange="S.tpl=this.value"><option>Participation Certificate</option><option>Achievement</option><option>Workshop</option></select>
<label>Font</label><select onchange="S.font=this.value;render()">${['Georgia','Arial','Courier New','Trebuchet MS'].map(f=>`<option ${f==S.font?'selected':''}>${f}</option>`).join('')}</select>
<label>Font size ${S.size}px</label><input type="range" min="16" max="44" value="${S.size}" oninput="S.size=this.value;live()"><label>Name position</label><input type="range" min="20" max="80" value="${S.pos}" oninput="S.pos=this.value;live()">
<label>Event name</label><input value="${S.ev}" oninput="S.ev=this.value;live()"><button class="s" onclick="toast('Custom template uploaded (demo)')">Upload Certificate</button> <button class="p" onclick="modal(cert(S.rows[S.sel].n))">Preview Certificate</button></div><div class="card" id="pv">${cert(S.rows[S.sel].n)}<p class="mu" style="text-align:center">{{Name}} → ${S.rows[S.sel].n}</p></div></div>${step('Continue to Generate','gen')}`;
if(v=='gen')return`<h1>Generate Certificates</h1><div class="card">Recipients: 486<br>Valid recipients: 486<br>Template: Participation Certificate<br><br>${S.gen=='run'?`<div id="gl"></div>`:S.gen?`<h2 style="color:var(--gr)">✓ 486 certificates generated successfully</h2>${step('Continue to Email Delivery','email')}`:`<button class="p" style="font-size:16px;padding:14px 28px" onclick="generate()">Generate Certificates</button>`}</div>`;
if(v=='email')return`<h1>Email Delivery</h1><div class="grid g2"><div class="card"><label>Sender Name</label><input value="${S.sender}" oninput="S.sender=this.value"><label>Subject</label><input value="${S.sub}" oninput="S.sub=this.value"><label>Body <small class="mu">Variables: {{Name}} {{Event}} {{Certificate}}</small></label><textarea rows="10" oninput="S.body=this.value">${S.body}</textarea><button class="s" onclick="popup('📨','Test email sent!','A preview was delivered to you@example.com (demo).','Got it')">Send Test Email</button> <button class="p" onclick="startSend()">Start Sending</button></div>
<div class="card"><h2>Attachment preview</h2>📎 ${R[0].n.replace(' ','_')}_certificate.pdf${cert(R[0].n,16)}</div></div>`;
if(v=='send')return`<h1>Sure Send is delivering certificates...</h1><div class="flow l"><span>Google Sheet</span>→<span>Validation</span>→<span>Certificate Generation</span>→<span style="background:var(--bl);color:#fff">Email Delivery</span>→<span>Status Logging</span></div><div class="grid"><div class="card"><div class="big" style="color:var(--gr)" id="cs">0</div>Sent</div><div class="card"><div class="big" style="color:var(--rd)" id="cf">0</div>Failed</div><div class="card"><div class="big" style="color:var(--or)" id="cp">486</div>Pending</div></div><div class="card">${pb(0).replace('<b','<b id="sb"')}<div id="log" style="margin-top:12px"></div></div>`;
if(v=='status')return`<h1>Delivery Status</h1><div class="card tw"><table><tr><th>Participant</th><th>Email</th><th>Certificate</th><th>Email Status</th><th>Time</th><th>Actions</th></tr>${R.map((r,i)=>`<tr><td>${r.n}</td><td>${r.e}</td><td>${tag('Generated')}</td><td>${tag(r.es)}</td><td>${r.t}</td><td>${r.es=='Failed'?`<button class="p sm" onclick="retry(${i})">Retry</button>`:r.es=='Sent'?`<button class="s sm" onclick="modal(cert('${r.n}'))">View Certificate</button> <button class="g sm" onclick="toast('Resent to ${r.e}')">Resend</button>`:'—'}</td></tr>`).join('')}</table></div>${S.sent?`<button class="p" onclick="go('done')">Finish campaign →</button>`:''}`;
if(v=='ana'){const d=[12,34,58,91,140,72,45,20];return`<h1>Analytics</h1><div class="grid">${[['486','Certificates'],['481','Delivered'],['98.9%','Delivery Rate'],['2m 34s','Processing Time']].map(c=>`<div class="card"><div class="big">${c[0]}</div>${c[1]}</div>`).join('')}</div><div class="card"><h2>Emails sent per minute <span class="mu" id="ro" style="font-weight:400">— hover a bar</span></h2><svg viewBox="0 0 400 140" style="width:100%">${d.map((x,i)=>`<rect x="${i*49+6}" y="${135-x}" width="40" height="${x}" rx="6" fill="#2563eb" opacity=".85" onmouseover="$('#ro').textContent='Minute ${i+1}: ${x} sent'"/>`).join('')}</svg></div><div class="card"><h2>Delivery success</h2>${pb(98.9)}<p class="mu">481 delivered · 5 failed</p></div>`}
if(v=='hood')return`<h1>Under the Hood</h1><div class="card" style="border:2px solid var(--bl)"><h2>⚙ n8n Automation Engine</h2><p class="mu">n8n orchestrates every step: it watches the sheet, calls validation, renders certificates, sends emails and writes status back.</p>${['Google Sheets','Data Ingestion','Smart Validation','Certificate Generation','Email Distribution','Status Logging'].map((x,i)=>`<div style="text-align:center"><div class="card" style="margin:0 auto;max-width:280px;background:var(--sf)">${x}</div>${i<5?'<div class="mu">↓</div>':''}</div>`).join('')}</div><h2>Smart Automation</h2><div class="grid g2">${[['Smart Column Detection','Maps messy headers automatically.'],['Email Validation','Detects invalid formats and duplicates.'],['Auto-Correction','gmial.com → gmail.com'],['AI Personalization','"Rahul demonstrated excellent participation throughout the workshop." '+tag('AI Generated')]].map(c=>`<div class="card"><b>${c[0]}</b><p class="mu">${c[1]}</p></div>`).join('')}</div>`;
if(v=='set')return`<h1>Settings</h1><div class="card"><label><input type="checkbox" style="width:auto" ${S.demo?'checked':''} onchange="S.demo=this.checked;render()"> <b>Demo Mode: ${S.demo?'ON':'OFF'}</b></label><p class="mu">${S.demo?'Simulated sheet, certificates and email sending. No credentials required.':'Live mode needs Google API and SMTP credentials.'}</p><button class="g" onclick="reset()">Reset demo</button></div>`;
if(v=='done')return`<div class="card" style="text-align:center;padding:40px"><div style="font-size:56px">🎉</div><h1>Campaign Complete</h1><p class="mu">Your certificates have been delivered.</p><div class="grid">${[['486','Certificates Generated'],['481','Successfully Delivered'],['5','Failed'],['98.9%','Delivery Success']].map(c=>`<div class="card"><div class="big">${c[0]}</div>${c[1]}</div>`).join('')}</div><button class="p" onclick="go('status')">View Delivery Report</button> <button class="s" onclick="toast('report.csv downloaded (demo)')">Download Report</button> <button class="g" onclick="reset()">Start New Campaign</button></div>`}
function home(){return`<div class="hero"><div class="logo" style="justify-content:center;font-size:22px"><i>✉</i>Sure Send</div><h1>Automate certificate delivery from a spreadsheet.</h1><p>Upload your participant data, generate personalized certificates, and send them automatically — without manual copy-paste.</p><button class="p" onclick="go('dash')">Start Sending</button> <button class="g" style="color:#fff;border-color:#ffffff55" onclick="S.v='upload';S.up=1;render()">View Demo</button><div class="float">${cert('Priya Singh',16)}</div><div class="flow">${['Google Sheet','Data Validation','Certificate Generation','Email Delivery','Delivery Dashboard'].map(x=>`<span>${x}</span>`).join('→')}</div></div><div class="pg"><div class="grid">${[['Smart Data Detection','Automatically identify Name and Email columns even when headers are messy.'],['Personalized Certificates',"Insert each participant's exact name into the certificate template."],['Automated Delivery','Send certificates to every valid recipient and track delivery status.']].map(c=>`<div class="card"><h2>${c[0]}</h2><span class="mu">${c[1]}</span></div>`).join('')}</div></div>`}
function render(){if(S.v=='home'){$('#root').innerHTML=home();return}
$('#root').innerHTML=`<div class="app"><aside><div class="logo"><i>✉</i>Sure Send</div>${NAV.map(n=>`<a class="${S.v==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}</aside><main><div class="top"><div class="logo" style="cursor:pointer" onclick="go('home')"><i>✉</i>Sure Send</div><div><span class="tag ${S.demo?'ok':'wn'}">Demo Mode: ${S.demo?'ON':'OFF'}</span> <button class="g sm" onclick="toast('No new notifications')">🔔</button> <button class="g sm" onclick="toast('Signed in as Organizer')">👤 Organizer</button> <button class="p sm" onclick="reset();go('upload')">+ New Campaign</button></div></div><div class="pg">${stepper()}${view()}</div></main></div>`}
function live(){$('#pv').innerHTML=cert(S.rows[S.sel].n)+`<p class="mu" style="text-align:center">{{Name}} → ${S.rows[S.sel].n}</p>`}
function modal(h){$('#mc').innerHTML=h;$('#modal').classList.add('on')}
function analyze(){S.an='run';render();setTimeout(()=>{S.an=1;render();popup('🔍','Columns detected!','Name and Email found across 500 rows with 98% confidence.','Nice!')},1600)}
function fix(i){const r=S.rows[i];if(r.st=='Duplicate'){S.rows.splice(i,1)}else{r.e=r.e.includes('@@')?r.e.replace('@@','@'):r.e.replace('gmial','gmail').replace(/@gmail$/,'@gmail.com');r.st='Auto-corrected'}render();toast('Issue resolved')}
function autofix(){S.rows=S.rows.filter(r=>r.st!='Duplicate');S.rows.forEach(r=>{if(r.st!='Valid'){r.e=r.e.replace('@@','@').replace('gmial','gmail').replace(/@gmail$/,'@gmail.com');r.st='Auto-corrected'}});S.fixed=1;render();popup('🪄','Sheet cleaned!','4 issues auto-corrected and 1 duplicate removed. Every recipient is ready.','Continue',"go('tpl')")}
function generate(){S.gen='run';render();const st=['Preparing data...','Validating recipients','Loading certificate template','Personalizing certificates','Generating PDFs','Preparing emails'];let i=0;const t=setInterval(()=>{i++;const g=$('#gl');if(!g){clearInterval(t);return}g.innerHTML=st.map((s,k)=>k<i?`✓ ${s}<br>`:k==i?`<span class="spin">⟳</span> ${s}<br>`:'').join('')+pb(Math.round(i/st.length*100));if(i>=st.length){clearInterval(t);S.gen=1;confetti();setTimeout(()=>{render();popup('🎓','486 certificates ready!','A personalized PDF was generated for every recipient.','Continue to Email',"go('email')")},400)}},650)}
function startSend(){S.v='send';S.rows.forEach(r=>{r.es='Pending';r.t='—'});render();let i=0;const n=S.rows.length,fails=[2,7];const t=setInterval(()=>{if(S.v!='send'){clearInterval(t);return}
if(i>0){const p=S.rows[i-1],f=fails.includes(i-1);p.es=f?'Failed':'Sent';p.t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#log').firstChild.outerHTML=`<div>${f?'✗':'✓'} ${p.n} — ${f?'Failed':'Certificate Sent'}</div>`}
if(i<n){$('#log').insertAdjacentHTML('afterbegin',`<div><span class="spin">⟳</span> ${S.rows[i].n} — Sending...</div>`)}
const done=Math.min(i,n),sc=Math.round(done/n*481),fc=Math.round(done/n*5);$('#cs').textContent=sc;bump('#cs');$('#cf').textContent=fc;$('#cp').textContent=486-sc-fc;$('#sb').style.width=done/n*100+'%';
if(i>n){clearInterval(t);S.sent=1;go('done');return}i++},650)}
function retry(i){const r=S.rows[i];r.es='Retrying';render();setTimeout(()=>{r.es='Sent';r.t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});render();toast('Retry succeeded')},1200)}
function reset(){location.reload()}
render();

function stepper(){const f=['upload','rec','tpl','gen','email','send','done'],L=['Upload','Validate','Template','Generate','Email','Send','Done'];const i=S.v=='status'?5:f.indexOf(S.v);if(i<0)return'';return`<div class="stp">${L.map((l,k)=>`<div class="${k<i?'dn':k==i?'cu':''}"><b>${k<i?'✓':k+1}</b>${l}</div>`).join('')}</div>`}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:20';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d'),cl=['#2563eb','#16a34a','#f59e0b','#ec4899','#8b5cf6'],p=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,vx:Math.random()*4-2,vy:Math.random()*4+3,r:Math.random()*6+5,c:cl[Math.random()*5|0],a:Math.random()*6}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.a+=.1;x.fillStyle=q.c;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillRect(-q.r/2,-q.r/2,q.r,q.r*.6);x.restore()});if(++f<220)requestAnimationFrame(d);else c.remove()})()}
function countUp(){document.querySelectorAll('.big').forEach(e=>{const t=e.textContent.trim();if(e.id||!/^\d+$/.test(t))return;const n=+t,s=performance.now();(function f(now){const p=Math.min((now-s)/700,1);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})}
const _r=render;render=function(){_r();countUp()};render();

function popup(i,t,m,b,fn){modal(`<div class="pop"><div class="pi">${i}</div><h2>${t}</h2><p class="mu">${m}</p><button class="p" onclick="$('#modal').classList.remove('on');${fn||''}">${b}</button></div>`)}
function bump(q){const e=$(q);e.classList.remove('bmp');void e.offsetWidth;e.classList.add('bmp')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect(),d=document.createElement('span');d.className='rip';d.style.left=e.clientX-r.left+'px';d.style.top=e.clientY-r.top+'px';b.appendChild(d);setTimeout(()=>d.remove(),600)});
</script></body></html>
